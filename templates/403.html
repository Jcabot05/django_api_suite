{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Acceso denegado</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.output.css' %}">
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    <main class="flex items-center justify-center min-h-screen px-6">
        <section class="max-w-lg p-8 text-center bg-white rounded-lg shadow-xl dark:bg-gray-800">
            <p class="mb-2 text-6xl font-bold text-purple-600">403</p>
            <h1 class="mb-3 text-2xl font-semibold text-gray-800 dark:text-gray-100">
                Acceso denegado
            </h1>
            <p class="mb-6 text-gray-600 dark:text-gray-300">
                Tu usuario no tiene permiso para consultar el dashboard.
            </p>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="px-5 py-2 text-white bg-purple-600 rounded-lg hover:bg-purple-700">
                    Cerrar sesión
                </button>
            </form>
        </section>
    </main>
</body>
</html>
